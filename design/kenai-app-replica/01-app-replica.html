<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kenai for Android · replica of today's app</title>
<style>/* Kenai for Android, replica of today's app. Values from app/src/main/kotlin/com/kenai/android/core/Tokens.kt
   (Tokens.DARK, IslandSurface, StatusPalette, Spacing, Radii, TypeScale), ui/Theme.kt and res/values/colors.xml. */
:root{
  --bg:#000;--panel:#141518;--panel2:#1D1F23;--line:#26282D;
  --text:#F5F6F8;--dim:#9398A1;--faint:#6E737C;
  --pri:#F5F6F8;--onpri:#0B0C0E;--sec:#292A2D;--danger:#FF8D97;--sw-on:#34D399;
  --online:#0F9F6E;--busy:#B45309;--offline:#6B7280;
  --hero:#0E0F12;--isl-panel:#141518;--isl-btn:#2A2B2E;
  --m3-primary:#8AB4FF;--m3-dialog:#2B2930;
  --font:Roboto,"Google Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{width:1440px;height:900px;overflow:hidden;background:#0a0b0e;color:#e8e9ec;font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea,select{font:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- canvas chrome (not part of the app) ---------- */
.tbar{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #1c1d22;background:#0d0e12}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:15px;font-weight:600;color:#f1f2f4}
.brand span{font-size:12px;color:#8a8f98}
.seg{display:flex;padding:3px;border-radius:999px;background:#17181d;border:1px solid #23252b}
.seg button,.cb{min-height:36px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:#a3a8b1}
.seg button[aria-pressed=true]{background:#2a2c33;color:#fff}
.cb{background:#17181d;border:1px solid #23252b;color:#e3e5e9}
.cb:hover,.seg button:hover{color:#fff}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a8f98}
.ctl select{background:#17181d;color:#e3e5e9;border:1px solid #23252b;border-radius:8px;height:32px;padding:0 6px;font-size:12px}
.ctl[hidden]{display:none}
#stepinfo{min-width:220px;font-variant-numeric:tabular-nums;color:#c9ccd2}
#stepinfo i{font-style:normal;color:#8a8f98}
.stage{position:absolute;left:0;right:0;top:64px;bottom:0;display:flex;gap:28px;padding:16px 24px 0 28px}
.col-phone{display:flex;flex-direction:column;align-items:center;gap:6px}
.cap{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7d828b}
.hint{font-size:11.5px;color:#6f747d;max-width:380px;text-align:center}

/* ---------- the phone ---------- */
.phone{position:relative;width:360px;height:760px;border-radius:38px;background:#000;overflow:hidden;box-shadow:0 0 0 7px #16171b,0 0 0 8px #2b2d33,0 24px 60px rgba(0,0,0,.6);color:var(--text);flex:none}
.phone.flash{animation:flash .5s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 7px #16171b,0 0 0 8px #8ab4ff,0 24px 60px rgba(0,0,0,.6)}100%{box-shadow:0 0 0 7px #16171b,0 0 0 8px #2b2d33,0 24px 60px rgba(0,0,0,.6)}}
.sbar{position:absolute;left:0;right:0;top:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:13px;font-weight:600;color:#F5F6F8;z-index:70;pointer-events:none}
.sbar .cam{position:absolute;left:50%;top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#050506;box-shadow:inset 0 0 0 2px #15161a}
.sbar .r{display:flex;gap:5px;align-items:center}
.sbar .r i{display:inline-block;width:14px;height:9px;border-radius:2px;background:#F5F6F8}
.sbar .r i.w{width:20px;height:10px;border-radius:3px;background:none;box-shadow:inset 0 0 0 1.5px #F5F6F8;position:relative}
.sbar .r i.w::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:11px;background:#F5F6F8;border-radius:1px}
.gbar{position:absolute;left:0;right:0;bottom:0;height:20px;display:flex;align-items:center;justify-content:center;z-index:70;background:#000}
.gbar button{width:140px;height:20px;display:flex;align-items:center;justify-content:center}
.gbar button::after{content:"";width:108px;height:4px;border-radius:2px;background:#F5F6F8;opacity:.9}
.screen{position:absolute;left:0;right:0;top:0;bottom:20px;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.ptop{padding-top:28px}
.gut{padding-left:16px;padding-right:16px}
.col{display:flex;flex-direction:column;gap:12px}
.clear{height:96px;flex:none} /* BarClearance */

/* type scale (core/TypeScale) */
.t-display{font-size:28px;line-height:34px;font-weight:700}
.t-title{font-size:20px;line-height:26px;font-weight:700}
.t-head{font-size:16px;line-height:22px;font-weight:600}
.t-body{font-size:15px;line-height:22px;font-weight:400}
.t-sec{font-size:13px;line-height:18px;font-weight:400}
.t-label{font-size:12px;line-height:16px;font-weight:600}
.t-mono{font-family:var(--mono);font-size:12px;line-height:18px}
.dim{color:var(--dim)}.faint{color:var(--faint)}.white{color:#F5F6F8}.dang{color:var(--danger)}
.center{text-align:center}
.u{text-decoration:underline}
p{margin:0}h1,h2{margin:0;font:inherit}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* building blocks (ui/DesignSystem.kt) */
.panel{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.wash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle var(--wr,279px) at 50% 130%,var(--wash),rgba(0,0,0,0))}
.panel>*:not(.wash),.hero>*:not(.wash),.sheet>*:not(.wash){position:relative}
.pb{min-height:48px;border-radius:999px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:22px;font-weight:600;background:var(--sec);color:var(--text);white-space:nowrap;overflow:hidden;min-width:0}
.pb span{overflow:hidden;text-overflow:ellipsis}
.pb.pri{background:var(--pri);color:var(--onpri)}
.pb.dan{color:var(--danger)}
.pb.dk{background:var(--isl-btn);color:#F5F6F8}
.pb.dk.pri{background:#F5F6F8;color:#0B0C0E}
.pb:disabled{opacity:.4}
.pb.wide{width:100%}
.row2{display:flex;gap:12px;width:100%}.row2.g8{gap:8px}.row2.g10{gap:10px}
.row2>.pb{flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.div{height:1px;background:var(--line);width:100%}
.lr{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%;text-align:left}
.lr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lr-t b{font-size:15px;line-height:22px;font-weight:600}
.lr-t span{font-size:13px;line-height:18px;color:var(--dim)}
.sh{font-size:12px;line-height:16px;font-weight:600;color:var(--dim);padding:8px 0 0 4px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--panel2);font-size:12px;line-height:16px;font-weight:600;max-width:100%}
.ic{flex:none;display:block}
/* switch and slider (ui/DesignControls.kt) */
.sw{min-width:52px;min-height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.sw i{position:relative;width:52px;height:30px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);display:block}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .28s cubic-bezier(.3,1.35,.5,1)}
.sw i{border-width:0;box-shadow:inset 0 0 0 1px var(--line)}
.sw.on i{background:var(--sw-on);box-shadow:none}
.sw.on i::after{transform:translateX(22px)}
.sw:disabled{opacity:.4}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:48px;background:transparent;margin:0;--f:60%}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--text) var(--f),var(--panel2) var(--f))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.25);margin-top:-9px}
.slider:disabled{opacity:.4}
.step{width:48px;height:48px;border-radius:50%;background:var(--sec);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
.step:disabled{opacity:.4}

/* screen titles (ui/SettingsScreens.kt ScreenTitle) */
.st-root{display:flex;align-items:center;padding:16px 0 4px}
.st-root h1{flex:1;padding-left:4px}
.st-back{display:flex;align-items:center;padding-top:8px;gap:0}
.st-back h1{flex:1;font-size:22px;line-height:28px;font-weight:700;min-width:0}
.tbtn{min-height:40px;padding:0 12px;border-radius:20px;color:var(--m3-primary);font-size:14px;font-weight:500;letter-spacing:.01em;flex:none}
.tlink{min-height:48px;padding:14px 12px;font-size:12px;line-height:16px;font-weight:600;color:var(--dim);flex:none}

/* bottom bar (ui/BottomBar.kt) */
.bbar{position:absolute;left:24px;right:24px;bottom:16px;height:64px;border-radius:999px;background:var(--panel);border:1px solid var(--line);padding:5px;display:flex;gap:4px;z-index:20}
.bbar button{flex:1;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:var(--dim);font-size:12px;line-height:16px;font-weight:600}
.bbar button[aria-selected=true]{background:var(--panel2);color:var(--text)}
.bbar .alert{position:absolute;top:4px;left:calc(50% + 6.5px);width:9px;height:9px;border-radius:50%;background:#F5A524;box-shadow:0 0 0 2px var(--panel)}

/* Home hero (ui/HomePanel.kt HeroCard + HeroPanel) */
.hero{position:relative;background:var(--hero);border-radius:0 0 30px 30px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06),inset 1px 0 0 rgba(255,255,255,.06),inset -1px 0 0 rgba(255,255,255,.06);overflow:hidden;padding:40px 16px 18px;display:flex;flex-direction:column;gap:8px;--wr:306px}
.hero .lk{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;color:#9398A1}
.hero .lk .ell{flex:1;min-width:0}
.hero .who{display:flex;align-items:center;gap:14px}
.hero .who>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hero .btns{display:flex;gap:8px;flex-wrap:nowrap}
.hero .btns .pb{padding:0 18px}
.hero .empty{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Koda sprite (character/KodaView.kt) */
.koda{display:inline-flex;align-items:center;justify-content:center;flex:none}
.koda i{display:block;width:var(--s);height:var(--s);image-rendering:pixelated;background-repeat:no-repeat}

/* rows on Home */
.arow{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;width:100%;text-align:left}
.arow>div{flex:1;min-width:0}
.arow b{display:block;font-size:15px;line-height:22px;font-weight:600}
.arow span{display:block;font-size:13px;line-height:18px;color:var(--dim)}
.rrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;width:100%;text-align:left}
.bar8{height:8px;border-radius:4px;background:var(--sec);overflow:hidden}
.bar8 i{display:block;height:100%;border-radius:4px}

/* pairing / scan */
.pairing{display:flex;flex-direction:column;align-items:center;padding:28px 24px 0}
.scan{position:absolute;inset:0;background:#000;padding:28px 16px 0;display:flex;flex-direction:column;gap:12px}
.cam{position:relative;flex:1;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#3a3d44,#16171a 60%,#0b0b0d)}
.cam .desk{position:absolute;left:50%;top:50%;width:190px;height:150px;transform:translate(-50%,-55%) perspective(500px) rotateX(8deg);background:#d9dbe0;border-radius:6px;box-shadow:0 0 0 7px #2b2d33,0 14px 30px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;filter:blur(.3px)}
.cam .vf{position:absolute;inset:0;pointer-events:none}
.simbtns{display:flex;gap:8px;position:absolute;left:10px;right:10px;bottom:10px}
.simbtns button{flex:1;min-height:34px;border-radius:10px;border:1px dashed rgba(255,255,255,.4);background:rgba(0,0,0,.55);font-size:11.5px;color:#dfe2e7;padding:0 6px}

/* sheets (ui/Sheets.kt BottomSheetHost) */
.host{position:absolute;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--isl-panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 1px 0 0 rgba(255,255,255,.08),inset -1px 0 0 rgba(255,255,255,.08);border-radius:28px 28px 0 0;padding:10px 20px 20px;max-height:94%;overflow-y:auto;scrollbar-width:none;--wr:306px;color:#F5F6F8}
.sheet.enter{animation:sheetIn .45s cubic-bezier(.2,1.25,.4,1)}
@keyframes sheetIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.shead{display:flex;align-items:center;gap:14px}
.shead>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cmd{border-radius:12px;background:rgba(255,255,255,.07);padding:12px;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;word-break:break-all}
.later{min-height:48px;padding:14px 0;font-size:13px;line-height:18px;color:#9398A1;display:block}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px transparent;width:100%;text-align:left}
.opt[aria-checked=true]{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(245,246,248,.7)}
.opt .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid #9398A1;display:flex;align-items:center;justify-content:center;flex:none}
.opt.multi .mk{border-radius:6px}
.opt[aria-checked=true] .mk{background:#F5F6F8;border-color:#F5F6F8}
.opt>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.field{width:100%;min-height:56px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#F5F6F8;padding:0 16px;font-size:16px;outline:none}
.field:focus{border:2px solid #F5F6F8;padding:0 15px}
.field::placeholder{color:#6E737C}
.drow{display:flex;gap:8px;padding:1px 6px;font-family:var(--mono);font-size:12px;line-height:18px;white-space:pre-wrap;word-break:break-all}
.drow b{font-weight:400;flex:none;width:8px}
.dlist{max-height:420px;overflow:auto;border-radius:8px;scrollbar-width:thin}

/* Material 3 dialog (PairConfirm, Clear chat) */
.dhost{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center}
.dlg{width:304px;background:var(--m3-dialog);border-radius:28px;padding:24px 24px 18px;color:#F5F6F8;animation:dlgIn .22s ease-out}
@keyframes dlgIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.dlg h2{font-size:24px;line-height:32px;font-weight:400;margin-bottom:16px}
.dlg p{font-size:14px;line-height:20px;color:#9398A1;white-space:pre-line}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.menu{position:absolute;z-index:46;background:#2B2930;border-radius:4px;padding:8px 0;min-width:200px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;min-height:48px;padding:0 16px;font-size:14px;color:#F5F6F8;text-align:left}
.menu button:hover{background:rgba(255,255,255,.08)}

/* Android system surfaces: biometric prompt, heads-up, permission dialog, settings page */
.bio-host{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.45)}
.bio{position:absolute;left:8px;right:8px;bottom:8px;background:#202124;border-radius:28px;padding:22px 22px 14px;text-align:center;animation:sheetIn .3s ease-out;color:#e8eaed}
.bio .app{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#bdc1c6;margin-bottom:10px}
.bio h2{font-size:22px;line-height:28px;font-weight:400}
.bio .sub{font-size:14px;color:#bdc1c6;margin-top:6px;word-break:break-all}
.bio .fp{width:72px;height:72px;border-radius:50%;margin:20px auto 8px;display:flex;align-items:center;justify-content:center;background:rgba(138,180,248,.12);color:#8ab4f8}
.bio .fp.ok{background:rgba(52,211,153,.18);color:#34d399}
.bio .fpt{font-size:13px;color:#bdc1c6}
.bio .acts{display:flex;justify-content:space-between;margin-top:14px}
.hu{position:absolute;top:34px;left:8px;right:8px;background:#2a2c31;border-radius:22px;padding:12px 14px 4px;z-index:55;box-shadow:0 10px 30px rgba(0,0,0,.55);animation:huIn .35s cubic-bezier(.2,1.2,.4,1);color:#e8eaed}
@keyframes huIn{from{transform:translateY(-120%)}to{transform:none}}
.hu .h{display:flex;align-items:center;gap:6px;font-size:12px;color:#bdc1c6}
.hu .body{display:block;width:100%;text-align:left;padding:6px 0 2px}
.hu .body b{display:block;font-size:15px;font-weight:500;color:#e8eaed}
.hu .body span{font-size:14px;color:#bdc1c6}
.hu .acts{display:flex;gap:4px}
.hu .acts button{min-height:40px;padding:0 12px;color:#8ab4f8;font-size:14px;font-weight:500}
.sysd{position:absolute;inset:0;z-index:62;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.sysd .box{width:300px;background:#2d2e31;border-radius:28px;padding:24px;text-align:center;color:#e8eaed}
.sysd .box p{font-size:18px;line-height:24px;margin:10px 0 18px}
.sysd .box button{display:block;width:100%;min-height:44px;border-radius:22px;background:#3c4043;color:#8ab4f8;font-size:14px;font-weight:500;margin-top:8px}
.sysp{position:absolute;inset:0;z-index:62;background:#121316;padding:28px 0 0;color:#e8eaed}
.sysp .top{display:flex;align-items:center;gap:8px;padding:8px 8px 16px}
.sysp .top button{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.sysp .top h2{font-size:22px;font-weight:400}
.sysp .app{display:flex;align-items:center;gap:14px;padding:8px 24px 18px;font-size:16px}
.sysp .opt2{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:0 24px;text-align:left;font-size:16px}
.sysp .note{padding:10px 24px;font-size:13px;color:#9aa0a6}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #9aa0a6;flex:none;position:relative}
.radio.on{border-color:#8ab4f8}.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#8ab4f8}

/* The Android home screen with the widgets: widgets.css (T1b). */

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chat typing dots (ui/ChatScreen.kt TypingDots: 1.2 s, one lit at a time) */
.typing i{width:8px;height:8px;border-radius:50%;background:var(--dim);opacity:.35;animation:tdot 1.2s steps(1) infinite}
.typing i:nth-child(2){animation-delay:.4s}.typing i:nth-child(3){animation-delay:.8s}
@keyframes tdot{0%{opacity:1}33.3%,100%{opacity:.35}}
textarea.field:focus{padding:15px}
.st-back .tbtn{margin-left:-12px}
.tbar>*{flex:none}.tbar .brand{flex:1 1 auto}
.brand b,.brand span,.seg button,#stepinfo{white-space:nowrap}
#stepinfo{width:330px;overflow:hidden;text-overflow:ellipsis}

/* The Android home screen with Kenai's 9 widgets (T1b). Values from res/values/colors.xml (dark, the default),
   res/values-notnight/colors.xml (light), res/values/dimens.xml (widget_*) and res/layout/widget_*.xml; 1 dp = 1 px here. */
.col-home{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.kw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;height:20px}

.kw-home{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px 26px 10px;border-radius:30px;height:770px;

/* widget_card + widget_tint_<tone>: the card, a 1 dp border in the tone and a 315° gradient of the tint. */
#widgets{--w-card:#17181C;--w-text:#FFFFFF;--w-soft:rgba(255,255,255,.85);--w-sec:rgba(255,255,255,.70);--w-btn:rgba(255,255,255,.12);--w-att-text:#F5A524;--w-on-tone:#1C1C1E}

.kw{position:relative;width:100%;height:100%;border-radius:24px;background:var(--w-card);box-shadow:inset 0 0 0 1px var(--kw-border),0 2px 10px rgba(0,0,0,.25);overflow:hidden;color:var(--w-text);font-family:var(--font);line-height:1.25}
.kw>.kw-tint{position:absolute;inset:1px;border-radius:23px;background:linear-gradient(135deg,var(--kw-tint),rgba(0,0,0,0));pointer-events:none}
.kw>.kw-hit{position:absolute;inset:0;border-radius:24px;cursor:pointer}
.kw>.kw-in{position:absolute;inset:0;display:flex;pointer-events:none}

.kw-hit:hover~.kw-in{filter:brightness(1.04)}
.kw-col{flex-direction:column;align-items:center}
.kw-face{position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.kw-face>.koda{overflow:hidden} /* a still picture (CharacterBitmap): data-still, first frame of the pose */
.kw-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kw-name{font-size:16px;font-weight:700;color:var(--w-text)}
.kw-state{font-size:13px;color:var(--w-sec)}
.kw-sec{font-size:12px;color:var(--w-sec)}
.kw-note{font-size:14px;font-weight:700;color:var(--w-soft)}
.kw-dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.kw-badge{min-width:22px;padding:1px 6px;border-radius:10px;background:#F5A524;color:var(--w-on-tone);font-size:12px;font-weight:700;text-align:center;flex:none}
.kw-row{display:flex;align-items:center;min-width:0}
.kw-off{flex:none;display:block}
/* widget_button_bg / widget_tile_bg(_attention) */
.kw-rb{width:36px;height:36px;border-radius:50%;background:var(--w-btn);margin-left:6px;padding:8px;flex:none;color:var(--w-text)}
.kw-rb svg,.kw-tile svg{display:block}
.kw-tile{flex:1;height:52px;margin:0 3px;border-radius:16px;background:var(--w-btn);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--w-text);font-size:12px;min-width:0}
.kw-tile.att{background:rgba(245,165,36,.25);box-shadow:inset 0 0 0 1px #F5A524}
.kw-lrow{display:flex;align-items:center;height:48px;width:100%;text-align:left;border-radius:10px}
.kw-lrow:hover{background:var(--w-btn)}
.kw-right{display:flex;flex-direction:column;justify-content:center;text-align:left;border-radius:12px;min-width:0}
.kw-right:hover{background:var(--w-btn)}
.kw-bar{height:6px;border-radius:3px;background:rgba(128,128,128,.25);margin-top:2px;overflow:hidden}

.kw button:focus-visible{outline:2px solid var(--w-text);outline-offset:-2px}

/* T15 (S18-S19): the three views beside the live phone — Screens, Over other apps and Notifications.

   island (#000, #F5F6F8, #9398A1, #2A2B2E) and neutral dark greys for Android's chrome (shade, lock screen) and for the fake

/* The View control hides one column and shows the other: display:flex on .col-home would win over [hidden] otherwise. */
[hidden]{display:none!important}

/* The toolbar holds one more control and must stay on one row at 1440 px. */

#stepinfo{width:150px;min-width:0}
.tbar .cb,#tbar .cb{padding:0 11px}
.brand b{font-size:14px}

/* ---------- Over other apps: the island (ui/IslandOverlay.kt, core/IslandGeometry.kt) ---------- */

/** Android's %1$s / %2$d / %% formatting, enough for strings.xml. */
function fmt(key, ...args) {
  return S[key].replace(/%(\d)\$[sd]/g, (_, i) => String(args[+i - 1])).replace(/%%/g, "%");
}

};
const KODA_ROLE = { GO: "#B8FF2E", SUN: "#FFE100", LIVE: "#2EB4FF", RED: "#FF5C75", FAINT: "#6F6D66" };
function roleOf(st) {
  if (st === "approval" || st === "question" || st === "ratelimit") return KODA_ROLE.SUN;
  if (st === "working" || st === "thinking" || st === "searching") return KODA_ROLE.LIVE;
  if (st === "finished") return KODA_ROLE.GO;
  if (st === "error" || st === "dizzy") return KODA_ROLE.RED;
  return KODA_ROLE.FAINT;
}
/* KodaPose.of(BotEmote): the nearest pose for a reaction (the Gallery shows each emote). */
const EMOTE_POSE = { love: "escucha", wink: "escucha", happy: "termino", proud: "termino", surprised: "espera", yawn: "reposo", annoyed: "error" };
/** KodaPose.of(BotState), or of an emote's name. */
function poseOf(st) {
  if (EMOTE_POSE[st]) return EMOTE_POSE[st];
  if (st === "idle" || st === "sleeping") return "reposo";
  if (st === "thinking" || st === "searching") return "piensa";
  if (st === "working") return "trabaja";
  if (st === "approval" || st === "question" || st === "ratelimit") return "espera";
  if (st === "finished") return "termino";
  return "error";
}

  askuserquestion: "Asking a question", bash: "Running a command", shell: "Running a command", read: "Reading files",
  edit: "Editing files", multiedit: "Editing files", write: "Editing files", grep: "Searching files", glob: "Searching files",
  ls: "Looking at files", websearch: "Searching the web", webfetch: "Reading a web page", task: "Running a sub-agent", todowrite: "Planning",
};
const TOOL_ACTION = {
  askuserquestion: "ask a question", bash: "run a command", shell: "run a command", read: "read files", edit: "edit files",
  multiedit: "edit files", write: "edit files", grep: "search files", glob: "search files", ls: "look at files",
  websearch: "search the web", webfetch: "read a web page", task: "run a sub-agent",
};
const toolKey = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
const toolClean = (n) => { const c = n.replace(/[_\-.:]+/g, " ").replace(/([a-z0-9])(?=[A-Z])/g, "$1 ").trim().toLowerCase(); return c.charAt(0).toUpperCase() + c.slice(1); };
function toolAction(tool) { const n = tool.trim(); return n ? TOOL_ACTION[toolKey(n)] || toolClean(n).toLowerCase() : "do something"; }
/** ToolLabels.label: a tool name in plain words; free text ("Reading the project") gives "" so the screen shows the state. */
function toolLabel(raw) {
  const text = raw.trim().replace(/·$/, "").trim();
  if (!text) return "";
  const at = text.indexOf(" · ");
  const head = at > 0 ? text.slice(0, at).trim() : text;
  const rest = at > 0 ? text.slice(at + 3).trim() : "";
  if (!/^[A-Za-z0-9_\-.:]+$/.test(head)) return "";
  const known = TOOL_KNOWN[toolKey(head)];
  const plausible = head.length <= 40 && !/[0-9]{3,}/.test(head) && (head.length <= 24 || /[_\-.:]/.test(head));
  if (!known && !plausible) return "";
  const tool = known || toolClean(head);
  // SafeText.requestLabel keeps only the program's name of a shell command.
  const program = rest && TOOL_ACTION[toolKey(head)] === "run a command" ? rest.split(/\s+/)[0].split("/").pop() : "";
  return program ? tool + " · " + program : tool;
}
/** SafeText.prose: words that look like a path, an address or a key become "…". */
const prose = (t) => t.trim().split(/\s+/).map((w) => { const c = w.replace(/^[.,;:!?"'()[\]]+|[.,;:!?"'()[\]]+$/g, ""); return /[\/\\@=]|:\/\//.test(c) || c.length > 32 ? "…" : w; }).join(" ");

/* core/HomeText.kt */

  if (s.state === "finished" && s.finalLine) { const p = prose(s.finalLine); if (p && p !== "…") return p; }
  return toolLabel(s.text) || null;
}

/**
 * KodaView / CharacterView: the 32x32 sprite at a whole-number scale, centred in a box of [box] px. [kind] is a state or an
 * emote; the pose follows it (KodaPose.of). o.glow: the agent colour as a soft light behind Koda (CharacterPainter,
 * AGENT_GLOW_ALPHA .38). o.still: the first frame only, as a widget (CharacterBitmap). box "fit": the largest whole scale the
 * parent allows, measured when painted. No label: hidden from the screen reader, as a CharacterView without a description.

function kodaEl(kind, box, label, o = {}) {

  const scale = fit ? 1 : Math.max(1, Math.floor(box / 32));

    return `${i > 0 ? divider() : ""}<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 16px;min-height:56px">${dot(c, "margin-top:6px")}<div style="flex:1;display:flex;flex-direction:column;gap:2px"><p class="t-body">${esc(title)} · ${esc(word)}</p><p class="t-sec dim">${esc(detail)}</p>${hint ? `<p class="t-sec">${esc(hint)}</p>` : ""}</div></div>`;

  return `<div class="scr gut"><div class="col">${items.join("")}</div></div>`;

function runDiag() {
  const d = st.diag;
  if (d.running) return;
  const all = st.link === "connected" ? DIAG_OK : DIAG_DOWN;
  d.running = true; d.results = []; d.copied = false;
  changed();
  let i = 0;
  const next = () => {
    if (st.diag !== d) return;
    d.results.push(all[i++]);
    if (i >= all.length) d.running = false; else setTimeout(next, 350);
    changed();
  };
  setTimeout(next, 350);
}
ACT.diagRun = () => runDiag();

"use strict";
/* eslint-disable no-unused-vars, no-undef -- the _src files are concatenated into one script by ../_build.mjs */
/* ui/ChatScreen.kt, core/ChatTab.kt, core/MarkdownLite.kt (bold, inline code, bullets, fenced code). Answers are fake. */

const CHAT_MAX = 4000; // Protocol.CHAT_MAX_TEXT
const STATE_TITLE = { NOT_PAIRED: "chat_off_not_paired_title", NOT_CONNECTED: "chat_off_offline_title", CHAT_OFF: "chat_off_title", NO_MODELS: "chat_nomodel_title", READY: "chat_title" };
const STATE_BODY = { NOT_PAIRED: "chat_off_not_paired_body", NOT_CONNECTED: "chat_off_offline_body", CHAT_OFF: "chat_off_hint", NO_MODELS: "chat_off_hint", READY: "chat_title" };

function mdSpans(t) {
  return esc(t).replace(/`([^`]+)`/g, '<code style="font-family:var(--mono);background:var(--panel2);border-radius:4px;padding:0 3px">$1</code>').replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
function markdown(text) {
  const out = [];
  const lines = text.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) code.push(lines[i]);
      out.push(`<pre class="t-mono" style="margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap">${esc(code.join("\n"))}</pre>`);
    } else if (/^[-*] /.test(l)) out.push(`<div class="t-body" style="display:flex"><span>•&nbsp;&nbsp;</span><span style="flex:1">${mdSpans(l.slice(2))}</span></div>`);
    else if (l.trim()) out.push(`<p class="t-body">${mdSpans(l)}</p>`);
  }
  return `<div style="display:flex;flex-direction:column;gap:8px">${out.join("")}</div>`;
}
const typingDots = () => '<div class="typing" style="display:flex;gap:6px;padding:8px 0"><i></i><i></i><i></i></div>';

function bubble(m) {
  if (m.role === "user") return `<div style="display:flex;justify-content:flex-end"><p class="t-body" style="max-width:300px;background:var(--panel2);border-radius:18px 18px 6px 18px;padding:10px 14px;white-space:pre-wrap;word-break:break-word">${esc(m.text)}</p></div>`;
  let h = "";
  if (!m.text && m.status === "streaming") h = typingDots();
  else if (m.text) h = markdown(m.text);
  if (m.status === "failed") h += `<p class="t-sec dang">${esc(S.chat_err_canceled)}</p>`;
  return `<div style="display:flex;flex-direction:column;gap:6px">${h}</div>`;
}

function chatEmpty(state) {
  const btn = state === "NOT_PAIRED" ? pill(S.chat_go_pair, "tab", { kind: "pri", w: true, arg: "HOME" }) : state === "NOT_CONNECTED" ? pill(S.chat_go_settings, "tab", { kind: "pri", w: true, arg: "SETTINGS" }) : "";
  return `<div class="gut" style="height:100%;display:flex;flex-direction:column">${screenTitle(S.chat_title)}
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px">${kodaEl("sleeping", 120)}
    <p class="t-title center" style="padding-top:16px">${esc(S[STATE_TITLE[state]])}</p><p class="t-body dim center" style="padding:8px 0 20px">${esc(S[STATE_BODY[state]])}</p>${btn}</div></div>`;
}

function chatScreen() {
  const c = st.chat;
  const tab = chatTabState();
  if (tab !== "READY" && !c.messages.length) return chatEmpty(tab);
  const clear = c.messages.length ? `<button type="button" class="tlink" data-act="chatClearAsk">${esc(S.chat_clear)}</button>` : "";
  const reason = !chatAvailable() ? panel(`<div style="padding:16px;display:flex;flex-direction:column;gap:4px"><p class="t-head">${esc(S[STATE_TITLE[tab]])}</p><p class="t-sec dim">${esc(S[STATE_BODY[tab]])}</p></div>`, null, "margin:4px 0") : "";
  const list = c.messages.length
    ? `<div class="scr" id="chatlist" style="position:static;height:100%;display:flex;flex-direction:column;gap:12px">${c.messages.map(bubble).join("")}</div>`
    : `<div style="height:100%;display:flex;align-items:center;justify-content:center"><p class="t-body dim center" style="padding:16px">${esc(S.chat_empty)}</p></div>`;
  const len = c.text.trim().length;
  const canSend = chatAvailable() && len >= 1 && len <= CHAT_MAX;
  const cur = FAKE.models.find((m) => m.id === c.model);
  let note = "";
  if (c.refusal === "BUSY") note = `<p class="t-sec dang">${esc(S.chat_ref_busy)}</p>`;
  else if (len > CHAT_MAX) note = `<p class="t-sec dang">${esc(S.chat_ref_too_long)}</p>`;
  else if (len > CHAT_MAX * 0.9) note = `<p class="t-sec dim">${esc(fmt("chat_count", len, CHAT_MAX))}</p>`;
  const action = c.busy
    ? `<button type="button" class="pb" style="height:56px" data-act="chatStop"><span>${esc(S.chat_stop)}</span></button>`
    : `<button type="button" aria-label="${esc(S.chat_send)}" data-act="chatSend" ${canSend ? "" : "disabled"} style="width:56px;height:56px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;flex:none;opacity:${canSend ? 1 : 0.4}">${icon("SEND", 22, "var(--onpri)")}</button>`;
  const menu = c.menu ? `<div class="menu" style="left:16px;bottom:120px">${FAKE.models.map((m) => `<button type="button" data-act="chatModel" data-arg="${m.id}">${esc(m.label)}</button>`).join("")}</div>` : "";
  return `<div class="gut" style="height:100%;display:flex;flex-direction:column">${screenTitle(S.chat_title, null, clear)}
    <p class="t-sec dim" style="padding:4px">${esc(S.chat_note)}</p>${reason}
    <div style="flex:1;min-height:0;position:relative">${list}</div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:8px 0">
      <button type="button" class="chip" style="min-height:48px;padding:0 14px;gap:6px;align-self:flex-start;background:var(--panel2)" data-act="chatMenu"><span class="ell">${esc(fmt("chat_model", cur ? cur.label : "—"))}</span><span style="transform:rotate(90deg);display:flex">${icon("CHEVRON", 16, "var(--dim)")}</span></button>
      <div style="display:flex;align-items:flex-end;gap:8px"><textarea id="chatbox" rows="1" class="field" style="border-radius:26px;background:var(--panel);border-color:var(--line);padding:16px;font-size:15px;resize:none;max-height:120px" placeholder="${esc(S.chat_placeholder)}" data-input="chat" ${chatAvailable() ? "" : "disabled"}>${esc(c.text)}</textarea>${action}</div>
      ${note}</div>${menu}</div>`;
}
function afterScreen() {
  const l = document.getElementById("chatlist");
  if (l) l.scrollTop = l.scrollHeight; // follow the answer as it grows
}
INPUT.chat = (v) => {
  const before = st.chat.text.trim().length;
  st.chat.text = v; st.chat.refusal = null;
  const after = v.trim().length;
  if ((before === 0) !== (after === 0) || after > CHAT_MAX * 0.9 || before > CHAT_MAX * 0.9) changed();
};
ACT.chatMenu = () => { st.chat.menu = !st.chat.menu; changed(); };
ACT.chatModel = (id) => { st.chat.model = id; st.chat.menu = false; changed(); };
ACT.chatClearAsk = () => { st.chat.confirmClear = true; changed(); };
ACT.clearCancel = () => { st.chat.confirmClear = false; changed(); };
ACT.clearOk = () => { st.chat.confirmClear = false; st.chat.messages = []; changed(); };
let chatTimer = null;
ACT.chatSend = () => {
  const c = st.chat;
  if (c.busy) { c.refusal = "BUSY"; changed(); return; }
  const text = c.text.trim();
  if (!text || !chatAvailable()) return;
  c.messages.push({ role: "user", text });
  const answer = { role: "assistant", text: "", status: "streaming" };
  c.messages.push(answer);
  c.text = ""; c.busy = true;
  changed();
  // A fake stream: the dots, then the answer a few words at a time.
  const words = FAKE.reply.split(/(?<=\s)/);
  let i = 0;
  clearInterval(chatTimer);
  setTimeout(() => {
    chatTimer = setInterval(() => {
      if (answer.status !== "streaming") { clearInterval(chatTimer); return; }
      answer.text += words.slice(i, i + 3).join(""); i += 3;
      if (i >= words.length) { answer.status = "done"; c.busy = false; clearInterval(chatTimer); }
      changed();
    }, 90);
  }, 700);
};
ACT.chatStop = () => {
  const last = st.chat.messages[st.chat.messages.length - 1];
  if (last && last.status === "streaming") last.status = "failed";
  st.chat.busy = false; clearInterval(chatTimer); changed();
};

function questionSheet(pillId) {
  const wash = STATE_COLOR.question;
  const colour = (PILLS[pillId] || {}).color;
  const req = questionFor(pillId);
  if (!req) {
    return sheet("q0:" + pillId, `<div class="shead">${kodaEl("question", 84, null, { glow: colour })}<p class="t-title white clamp3" style="flex:1">${esc(fmt("question_title", agentName(pillId)))}</p></div>
      <p class="t-body dim" style="padding:12px 0 16px">${esc(S.question_body)}</p>${pill_(S.question_ok, "notNow")}`, wash);
  }
  if (!st.qflow || st.qflow.fp !== req.fp) st.qflow = { fp: req.fp, index: 0, picks: req.questions.map(() => []) };
  const f = st.qflow;
  const q = req.questions[f.index];
  const on = armed("q:" + req.fp);
  const isLast = f.index === req.questions.length - 1;
  const complete = f.picks.every((p) => p.length > 0);
  const opts = q.options.map((o) => {
    const sel = f.picks[f.index].includes(o.label);
    return `<button type="button" class="opt ${q.multiSelect ? "multi" : ""}" role="${q.multiSelect ? "checkbox" : "radio"}" aria-checked="${sel}" data-act="qPick" data-arg="${esc(o.label)}"><span class="mk">${sel ? icon("CHECK", 16, "#0B0C0E") : ""}</span><div><b class="t-body" style="font-weight:600">${esc(o.label)}</b>${o.description ? `<span class="t-sec dim">${esc(o.description)}</span>` : ""}</div></button>`;
  }).join("");
  const nav = [];
  if (f.index > 0) nav.push(pill(S.question_back, "qBack", { dark: true }));
  if (isLast) nav.push(pill(S.question_send, "qSend", { kind: "pri", dark: true, disabled: !(on && complete), icon: "LOCK", iconSize: 18 }));
  else nav.push(pill(S.question_next, "qNext", { kind: "pri", dark: true, disabled: f.picks[f.index].length === 0 }));
  const position = req.questions.length > 1 ? `<p class="t-label dim">${esc(fmt("question_position", f.index + 1, req.questions.length))}</p>` : "";
  const inner = `<div class="shead">${kodaEl("question", 84, null, { glow: colour })}<div><p class="t-sec dim clamp2">${esc(fmt("question_title", agentName(pillId)))}</p>${position}</div></div>

  <div style="display:flex;flex-direction:column;gap:8px;padding-top:12px">${opts}</div>
  <div class="row2 g10" style="padding-top:16px">${nav.join("")}</div>

  <button type="button" class="later" data-act="notNow">${esc(S.approval_later)}</button>`;
  return sheet("q:" + req.fp, inner, wash);
}

/** link/Pairing.kt PairingPayload.parse */
function parsePairing(text) {
  let u;
  try { u = new URL(text.trim()); } catch (_) { return null; }
  if (u.protocol !== "abito:" || (u.host || u.pathname.replace(/^\/\//, "")) !== "pair") return null;
  const q = u.searchParams;
  if (q.get("v") !== "1") return null;
  const host = q.get("host"), port = +q.get("port"), fp = (q.get("fp") || "").toLowerCase(), token = q.get("token") || "";
  if (!host || host.length > 253 || !(port >= 1 && port <= 65535)) return null;
  if (!/^[0-9a-f]{64}$/.test(fp) || !/^[A-Za-z0-9_-]{16,128}$/.test(token)) return null;
  return { host, port, name: (q.get("name") || "").slice(0, 64) };
}
function fieldSheet(key, title, hint, placeholder, value, bad, badText, buttons) {
  return sheet(key, `<p class="t-title white">${esc(title)}</p><p class="t-sec dim" style="padding:4px 0 12px">${esc(hint)}</p>
    <input id="f-${key}" class="field" type="url" autocomplete="off" spellcheck="false" placeholder="${esc(placeholder)}" value="${esc(value)}" data-input="${key}">
    ${bad ? `<p class="t-sec dang" style="padding-top:8px">${esc(badText)}</p>` : ""}${buttons}`);
}

"use strict";
/* eslint-disable no-unused-vars, no-undef -- the _src files are concatenated into one script by ../_build.mjs */
/* What the widgets draw, as plain data: a port of core/Glance.kt (GlanceBuilder), core/WidgetData.kt (WidgetTone, UsageTone,
   PlanUsageLook, WidgetContent, WidgetData.build) and AppModel.glance()/widgetContent(), read from window.kenai only.
   The English texts below are the Kotlin literals of those two files, verbatim (they are not in strings.xml). */

/* WidgetTone (res/values/colors.xml widget_tone_*, widget_tint_*, widget_border_*): the one palette of every widget. */
const W_TONE = {
  MUTED: { c: "#94A2B8", tint: "rgba(148,162,184,.15)", border: "rgba(148,162,184,.6)" },
  IDLE: { c: "#B8BDC7", tint: "rgba(184,189,199,.15)", border: "rgba(184,189,199,.6)" },
  WORKING: { c: "#3B9EFF", tint: "rgba(59,158,255,.2)", border: "rgba(59,158,255,.6)" },
  ATTENTION: { c: "#F5A524", tint: "rgba(245,165,36,.25)", border: "rgba(245,165,36,.6)" },
  DONE: { c: "#34D499", tint: "rgba(52,212,153,.2)", border: "rgba(52,212,153,.6)" },
  TROUBLE: { c: "#F4505E", tint: "rgba(244,80,94,.2)", border: "rgba(244,80,94,.6)" },
};
/* UsageTone (widget_usage_*): teal, yellow from 75 %, red from 90 %. */
const W_USAGE = {
  CALM: { c: "#0E8F9A", tint: "rgba(14,143,154,.2)", border: "rgba(14,143,154,.6)" },
  CLOSE: { c: "#F2D024", tint: "rgba(242,208,36,.25)", border: "rgba(242,208,36,.6)" },
  LIMIT: { c: "#D92D20", tint: "rgba(217,45,32,.2)", border: "rgba(217,45,32,.6)" },
};
/** WidgetTone.of: the tone of one agent's state; a computer that is not connected is always muted. */
function toneOf(state, isConnected = true) {
  if (!isConnected) return "MUTED";
  if (state === "approval" || state === "question") return "ATTENTION";
  if (state === "working" || state === "thinking" || state === "searching") return "WORKING";
  if (state === "finished") return "DONE";
  if (state === "error" || state === "ratelimit" || state === "dizzy") return "TROUBLE";
  return "IDLE";
}

/* GlanceBuilder */
const G_ORDER = ["approval", "question", "error", "ratelimit", "dizzy", "working", "searching", "thinking", "finished", "sleeping", "idle"];
const G_BUSY = ["working", "thinking", "searching"];
const G_TROUBLE = ["error", "ratelimit", "dizzy"];
const rankOf = (state) => { const i = G_ORDER.indexOf(state); return i < 0 ? G_ORDER.length : i; };
/** GlanceBuilder.lineOf: the state in a few words, never the step text. */
function glanceLineOf(state) {
  return ({ approval: "Waiting for your approval", question: "Has a question", error: "Stopped on an error", ratelimit: "Hit a limit",
    dizzy: "Needs a look", finished: "Finished", sleeping: "Idle", idle: "Idle", thinking: "Thinking", searching: "Searching" })[state] || "Working";
}
/** AppModel.agentName: the session's agent, else its pill's name, else "An agent". */
const wNameOf = (list, pill) => ((list.find((s) => s.pill === pill) || {}).agent || (PILLS[pill] || {}).name || "An agent");

/**
 * GlanceBuilder.build with AppModel.glance()'s arguments: paired = mode != NONE (Not paired has no pairing), the link is
 * connected in Demo mode and in Paired mode with the link up, and the desktop's name is only known on a real computer
 * (AppModel.onWelcome ignores the demo's "Demo").
 */
function buildGlance(k) {
  const s = k.state;
  if (s.mode === "none") return { headline: "Not paired", detail: "Open Kenai to connect to your computer", connected: false, lines: [], waiting: 0 };
  if (!k.derived.connected()) return { headline: "Not connected", detail: "Kenai cannot reach your computer", connected: false, lines: [], waiting: 0 };
  const list = k.derived.sessions();
  const approvals = k.derived.approvals().length;
  const where = s.mode === "paired" ? DESKTOP.name : null;
  const ranked = [...list].sort((a, b) => rankOf(a.state) - rankOf(b.state));
  const lines = ranked.slice(0, 4).map((x) => ({ agent: wNameOf(list, x.pill), text: glanceLineOf(x.state), state: x.state }));
  const questions = list.filter((x) => x.state === "question").length;
  const waiting = approvals + questions;
  const busy = list.filter((x) => G_BUSY.includes(x.state)).length;
  const trouble = list.filter((x) => G_TROUBLE.includes(x.state)).length;
  const g = (headline, detail, w = 0) => ({ headline, detail, connected: true, lines, waiting: w });
  if (approvals > 0) return g("Waiting for you", approvals === 1 ? "1 request to approve" : `${approvals} requests to approve`, waiting);
  if (questions > 0) return g("Waiting for your answer", questions === 1 ? "1 question from an agent" : `${questions} questions from agents`, waiting);
  if (trouble > 0) return g("An agent needs a look", trouble === 1 ? "1 agent stopped" : `${trouble} agents stopped`);
  if (busy > 0) return g(busy === 1 ? `${wNameOf(list, ranked.find((x) => G_BUSY.includes(x.state)).pill)} is working` : `${busy} agents are working`, where ? `On ${where}` : "Working");
  if (list.some((x) => x.state === "finished")) return g("All done", where ? `On ${where}` : "Finished");
  return g("Connected", where ? `To ${where}` : "Nothing is running");
}

/* PlanUsageLook */
const usageTone = (pct) => (pct >= 90 ? "LIMIT" : pct >= 75 ? "CLOSE" : "CALM");
function resetLine(atMs, nowMs) {
  if (atMs <= 0 || atMs <= nowMs) return null;
  const at = new Date(atMs);
  const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((day(at) - day(new Date(nowMs))) / 864e5);
  const clock = `${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}`;
  if (days === 0) return `resets at ${clock}`;
  if (days < 7) return `resets ${at.toLocaleDateString("en-GB", { weekday: "short" })} ${clock}`;
  return `resets ${at.toLocaleDateString("en-GB", { month: "short" })} ${at.getDate()} ${clock}`;
}
/** WidgetData.row: one UsageRing (plan, window, pct, the "Near limit" note from the red line). */
function usageRow(plan, window, pct, resetsAtMs, nowMs) {
  const shown = Math.max(0, Math.min(100, pct));
  const near = shown >= 90;
  return { plan, window, shown, label: `${plan} · ${window}`, tone: usageTone(shown), near, note: near ? ["Near limit", resetLine(resetsAtMs, nowMs)].filter(Boolean).join(" · ") : null };
}
/**
 * The plan usage the computer sends (its switch on): only the fake desktop of "Paired (fake data)" sends it, from the same
 * FAKE.usage as the phone's Home. Demo mode sends none (DemoLink has no usage), so the ring asks to turn it on.
 */
function usageRowsNow(k, nowMs) {
  if (k.state.mode !== "paired" || !k.derived.connected()) return [];
  const u = FAKE.usage;
  return [["Claude", u.claude], ["Codex", u.codex]].filter(([, p]) => p && p.five).map(([name, p]) => usageRow(name, "5 h", p.five.pct, nowMs + p.five.resetMin * 60e3, nowMs));
}

/** WidgetData.build plus WidgetContent's derived values, for one picture of every widget. */
function buildContent(k, today) {
  const g = buildGlance(k);
  const list = g.connected ? k.derived.sessions() : [];
  const tiles = [...list].sort((a, b) => rankOf(a.state) - rankOf(b.state)).slice(0, 5)
    .map((x) => ({ pill: x.pill, name: wNameOf(list, x.pill), state: x.state, word: glanceLineOf(x.state), tone: toneOf(x.state) }));
  const rows = g.connected ? usageRowsNow(k, Date.now()) : [];
  const top = tiles[0] || null;
  const waiting = g.waiting;
  const c = { glance: g, headline: g.headline, connected: g.connected, waiting, tiles, top, usageRows: rows, ring: rows[0] || null, today };
  c.usageSide = !c.connected ? "NOT_CONNECTED" : rows.length ? "ROWS" : "OFF";
  c.emptyLine = tiles.length ? null : !c.connected ? "Waiting for your computer" : "No agents running";
  c.alertLine = !c.connected ? "Not connected" : waiting > 0 ? `${waiting} waiting` : "All calm";
  c.alertSub = !c.connected ? "Waiting for your PC" : waiting > 0 ? (top ? top.name : "") : "Nothing needs you";
  c.todayMood = today > 0 ? "finished" : "idle";
  c.todayLook = today > 0 ? "DONE" : "IDLE";
  c.look = !c.connected ? "MUTED" : waiting > 0 ? "ATTENTION" : top ? toneOf(top.state) : "IDLE";
  c.mood = top ? top.state : c.connected ? "idle" : "sleeping";
  // Glance.look() / Glance.mood(): the summary widget's own, from its lines (the same rule).
  c.glanceLook = !g.connected ? "MUTED" : g.waiting > 0 ? "ATTENTION" : g.lines[0] ? toneOf(g.lines[0].state) : "IDLE";
  c.glanceMood = g.lines[0] ? g.lines[0].state : g.connected ? "idle" : "sleeping";
  return c;
}

/**
 * The Today count (core/TodayCounter + AppModel.onSessions): a session moving into FINISHED from another state it was seen in
 * counts one. lastState is forgotten when the link stops (a mode change) and trimmed to the sessions present, as AppModel does.
 * As in the real app it counts on a paired computer only (AppModel.onSessions: mode == Mode.PAIRED), so Demo mode stays at 0.
 */
const todayCounter = {
  count: 0, last: new Map(), mode: null,
  observe(k) {
    if (k.state.mode !== this.mode) { this.mode = k.state.mode; this.last.clear(); }
    const list = k.derived.sessions();
    for (const s of list) {
      const prev = this.last.get(s.pill);
      this.last.set(s.pill, s.state);
      if (k.state.mode === "paired" && prev !== undefined && prev !== "finished" && s.state === "finished") this.count++;
    }
    const here = new Set(list.map((s) => s.pill));
    for (const p of [...this.last.keys()]) if (!here.has(p)) this.last.delete(p);
    return this.count;
  },
};

const wIcon = (k, size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${W_ICON[k]}</svg>`;

  /** UsageRingWidget (2x2): the ring and its percentage in the usage palette, or how to turn plan usage on. */
  ring(c) {

      <div style="position:relative;flex:1;min-height:0;width:100%"><svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="12"/>${arc}</svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${r.near ? 26 : 18}px;font-weight:${r.near ? 700 : 400}" data-k="ring">${r.shown}%</div></div>
      <div class="kw-state kw-ell" style="width:100%;text-align:center">${esc(r.label)}</div>${r.note ? `<div class="kw-ell" style="width:100%;text-align:center;font-size:12px;color:var(--w-soft)">${esc(r.note)}</div>` : ""}</div>` };
  },
  /** TodayWidget (2x2): today's finished tasks, Kenai pleased once there is one. */
  today(c) {
    return { look: c.todayLook, open: "home", label: fmt("widget_today_cd", c.today), html: `<div class="kw-in kw-col" style="padding:10px;justify-content:center">${wFace(c.todayMood, c.todayLook, "flex:1;width:100%")}

  },
  /** MoodWidget (1x1): only Kenai's face, with his glow; the "not connected" mark in the corner. */
  mood(c) {
    return { look: c.look, open: toSession(c.top), html: `<div class="kw-in" style="padding:4px">${wFace(c.mood, c.look, "flex:1")}</div>${c.connected ? "" : `<span style="position:absolute;right:3px;bottom:3px">${wOffline(14)}</span>`}` };
  },
};

"use strict";
/* eslint-disable no-unused-vars, no-undef -- the _src files are concatenated into one script by ../_build.mjs */
/* The widget panel: an Android home screen (wallpaper, a grid of 10 x 6 cells of 94 x 106 dp) with the 9 widgets at the grid size of
   their res/xml/kenai_*_widget_info.xml (targetCellWidth x targetCellHeight). It reads and drives the phone only through window.kenai. */

const K = window.kenai;
/** [key, label (strings.xml), column, row, cells wide, cells high] */
const W_LAYOUT = [
  ["big", "widget_big_label", 0, 0, 4, 4],
  ["list", "widget_list_label", 4, 0, 4, 3],
  ["alert", "widget_alert_label", 8, 0, 2, 2],
  ["ring", "widget_ring_label", 8, 2, 2, 2],
  ["pill", "widget_pill_label", 4, 3, 4, 1],
  ["glance", "widget_glance_label", 0, 4, 3, 2],
  ["solo", "widget_solo_label", 3, 4, 2, 2],
  ["today", "widget_today_label", 5, 4, 2, 2],
  ["mood", "widget_mood_label", 7, 4, 1, 1],
];
const CELL_W = 94;
const CELL_H = 106;
const CELL_PAD = 4; // the launcher's inset around a widget
const wState = { theme: "dark", today: 0, last: null };

/**
 * What a tap opens, as the PendingIntents of WidgetHub do: openApp → Home; openScreen → that screen (LaunchScreen: RECENT is
 * History, PAIR is the pairing Scan); openSession → that agent's Session details. "approval" is the Waiting Alert while
 * something waits: the app opens on Home with the request's sheet up.
 */
function wOpen(to) {
  const [kind, arg] = to.split(":");
  if (kind === "session") { K.state.detailPill = arg; K.go("SESSION"); }
  else if (kind === "screen") K.go(arg);
  else if (kind === "approval") { K.go("HOME"); K.openApproval(); }
  else K.go("HOME");
  const ph = document.getElementById("phone");
  ph.classList.remove("flash");
  void ph.offsetWidth; // restart the flash
  ph.classList.add("flash");
}

function widgetsShell() {
  setHTML($("#widgets"), `<div class="kw-head"><span class="cap">Home screen · Kenai's 9 widgets at their grid size</span>
    <div class="kw-theme"><span>Widgets:</span><div class="seg" role="group" aria-label="Widget theme">
      <button type="button" data-wtheme="dark">dark</button><button type="button" data-wtheme="light">light</button></div></div></div>
    <div class="kw-home"><div class="kw-sbar"><span id="kw-clock"></span><span>Android launcher · 10 × 6 cells</span></div>
    <div class="kw-grid" id="kw-grid"></div>
    <p class="kw-legend"><b>Live from the phone:</b> every change redraws them, as WidgetHub pushes a new picture per change (no timer).
    A tap opens the phone like the real PendingIntents: the card opens Home or the top agent's Session details, the buttons their screen,
    the Waiting Alert the pending request. <b>Widgets: dark / light</b> follows the system on a real phone (values / values-notnight); the phone stays dark.</p></div>`);
  $("#widgets").addEventListener("click", (e) => {
    const t = e.target.closest("[data-wtheme]");
    if (t) { wState.theme = t.dataset.wtheme; drawWidgets(); return; }
    const b = e.target.closest("[data-to]");
    if (b && $("#kw-grid").contains(b)) wOpen(b.dataset.to);
  });
}

function drawWidgets() {
  const root = $("#widgets");
  root.classList.toggle("kw-light", wState.theme === "light");
  root.dataset.theme = wState.theme;
  root.querySelectorAll("[data-wtheme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.wtheme === wState.theme)));
  const c = buildContent(K, wState.today);
  wState.last = c;
  const a = document.activeElement;

/** Jack into the demo loop and walk it to [target]; then hold, so the picture stays put. */
function scnStep(target) {
  scnReset();

  changed();
}

/** IslandPlan.active: a waiting request, then a question, then an agent at work. Nothing else, and nothing when blocked. */
function scnIslandSpec() {
  if (scnBlocker()) return null;

  if (a) spec = { kind: "APPROVAL", pill: a.pill, agent: agentName(a.pill), state: "approval", text: toolAction(a.tool), fp: a.fp, canAllow: !a.truncated && !scn.denyOnly };
  else {
    const q = sessions().find((s) => s.state === "question");
    const w = q ? null : sessions().find((s) => BUSY.includes(s.state));
    const s = q || w;
    if (s) {

      spec = { kind, pill: s.pill, agent: s.agent || agentName(s.pill), state: s.state, text: toolLabel(s.text) };

  }
  if (!spec) return null;
  spec.key = [spec.kind, spec.agent, spec.text, spec.fp || "", spec.canAllow === false ? "deny" : ""].join("|");

}

function scnApprovalLive() {
  const r = approvals()[0];
  return r ? { fp: r.fp, agent: agentName(r.pill), line: fmt("approval_wants", toolAction(r.tool)) } : null;
}
/** The demo's sample request, for a Kind picked by hand only: in Follow nothing is invented (R2). */
function scnApprovalSample() {
  const d = SCN_DEMO.APPROVAL;
  return { fp: null, agent: d.agent, line: fmt("approval_wants", toolAction("Bash")) };
}
function scnStatusList() {
  if (scn.nkind === "auto") return sessions().filter((s) => SCN_STATUS[s.state]).slice(0, 3);
  if (!SCN_STATUS[scn.nkind]) return [];
  const live = sessions().find((s) => s.state === scn.nkind);
  const d = SCN_DEMO[scn.nkind.toUpperCase()];
  return [live || { pill: d.pill, agent: d.agent, state: scn.nkind, text: d.text }];
}
function scnNotifModel() {
  let approval = null;
  if (scn.nkind === "auto") approval = scnApprovalLive();
  else if (scn.nkind === "approval") approval = scnApprovalLive() || scnApprovalSample();
  const statuses = scn.nkind === "link" ? [] : scnStatusList();
  return { approval, statuses, waiting: scn.nkind === "auto" && !approval };
}
/** Follow with nothing pending: the slot says so; the app posts no approval notification at all in that state. */
function scnWaitingCard() {
  return `<p class="shd-empty" id="scn-no-request">${esc(SCN_NO_REQUEST)}</p>`;
}

function scnNotifChannel() {
  return scn.alert === "quiet" ? "approvals_quiet · LOW" : "approvals_v3 · HIGH";
}

function scnShadeCard(m) {
  if (!m) return "";
  return scnN(`<p class="shd-t">${esc(`${m.agent} needs your approval`)}</p>
    <p class="shd-x">${esc(m.line)}</p>
    <div class="shd-a"><button type="button" id="scn-ndeny" data-scn="notif:deny">${esc(S.action_deny)}</button>
      <button type="button" id="scn-nreview" data-scn="notif:review">${esc(S.action_review)}</button></div>`,
  { chrono: true, channel: scnNotifChannel() });
}
function scnStatusCard(s) {
  const what = SCN_STATUS[s.state] || S.notif_finished;
  const sub = toolLabel(s.text || "");
  return scnN(`<p class="shd-t">${esc(s.agent)}</p><p class="shd-x">${esc(what)}</p>${sub ? `<p class="shd-s">${esc(sub)}</p>` : ""}`,
    { channel: "updates · LOW" });
}
function scnLinkCard(expanded) {
  const headline = st.mode === "none" ? S.status_not_connected
    : st.mode === "demo" ? S.status_connected
      : st.link === "connected" ? `${S.status_connected} · ${DESKTOP.name}` : st.link === "connecting" ? S.status_connecting : S.status_not_connected;
  const detail = st.mode === "none" ? "" : `${DESKTOP.name} · ${DESKTOP.host}`;
  const lines = (expanded ? sessions() : []).map((s) => `${s.agent || agentName(s.pill)}: ${stateLabel(s.state)}`);
  return scnN(`<p class="shd-t">${esc(headline)}</p>${detail ? `<p class="shd-x">${esc(detail)}</p>` : ""}
    ${lines.length ? `<p class="shd-lines">${lines.map((l) => esc(l)).join("<br>")}</p>` : ""}`,
  { channel: "link · LOW · ongoing" });
}

function scnNotif() {
  const m = scnNotifModel();
  if (m.approval && !scn.notifAt) scn.notifAt = Date.now();
  if (!m.approval) scn.notifAt = 0;
  const slot = m.approval ? scnShadeCard(m.approval) : "";
  const shade = [slot || (m.waiting ? scnWaitingCard() : ""), ...m.statuses.map(scnStatusCard),
    scnLinkCard(!m.approval), // while a request waits the link notification says the link only
  ].filter(Boolean).join("");
  const headsUp = m.approval && scn.alert === "heads" ? `<div class="shd-hu" role="status">
    <div class="shd-h"><span class="shd-ic">${launcherIcon(14)}</span><span class="shd-app">${esc(S.app_name)}</span><span class="shd-chrono" id="scn-chrono-hu">${esc(scnChronoText())}</span></div>
    <p class="shd-t">${esc(`${m.approval.agent} needs your approval`)}</p><p class="shd-x">${esc(m.approval.line)}</p>
    <div class="shd-a"><button type="button" data-scn="notif:deny">${esc(S.action_deny)}</button><button type="button" data-scn="notif:review">${esc(S.action_review)}</button></div></div>` : "";
  const lockApproval = m.approval ? scnN(`<p class="shd-t">${esc(S.approval_title)}</p><p class="shd-x">${esc(S.notif_unlock)}</p>`, { pub: true }) : "";
  const lockStatus = m.statuses.map((s) => scnN(`<p class="shd-t">${esc(S.app_name)}</p><p class="shd-x">${esc(SCN_STATUS[s.state] || S.notif_finished)}</p>`, { pub: true })).join("");
  const lockLink = scnN(`<p class="shd-t">${esc(S.app_name)}</p><p class="shd-x">${esc(connected() ? S.status_connected : S.status_not_connected)}</p>`, { pub: true });
  const kinds = SCN_NKINDS.map(([k, l]) => `<button type="button" id="scn-nkind-${k}" class="scn-chip sm" data-scn="nkind:${k}" aria-pressed="${String(scn.nkind === k)}"><span class="scn-cl">${esc(l)}</span></button>`).join("");
  return `<div class="scn-head tight"><h2>Notifications</h2><p class="scn-note"><code>Notifications.kt</code>: one loud approval, quiet link and states, each kind in its own group. Android's shade and lock screen are stand-ins.</p></div>
    <div class="scn-row">
      <div class="scn-frame">
        <div class="phone scn-phone" id="scn-shade-phone">${scnStatusBar(true)}
          <div class="nt-app">${scnOtherApp(true)}</div>
          <div class="shd"><div class="shd-grab"></div>
            <div class="shd-q"><span>${esc(scnClock())}</span><span class="shd-qr">${icon("SCAN", 14, "#CBD0D8")}<i></i><i class="b"></i></span></div>
            <div class="shd-list">${shade}</div></div>
          ${headsUp}<div class="gbar"><button type="button" tabindex="-1" aria-hidden="true"></button></div></div>
        <p class="scn-cap">${scn.alert === "heads" ? "Heads-up over the app, and the shade below · loud" : "Quiet: no heads-up, the shade only · the pill is the alert"}</p>
      </div>
      <div class="scn-frame">
        <div class="phone scn-phone scn-lock" id="scn-lock-phone">${scnStatusBar(false)}
          <div class="lk-clock">${esc(scnClock())}</div><div class="lk-date">Monday, 17 November</div>
          <div class="lk-lock">${icon("LOCK", 18, "#CBD0D8")}</div>
          <div class="shd-list lk">${lockApproval}${lockStatus}${lockLink}</div>
          <div class="gbar"><button type="button" tabindex="-1" aria-hidden="true"></button></div></div>
        <p class="scn-cap">Lock screen · the PUBLIC versions (VISIBILITY_PRIVATE)</p>
      </div>
      <div class="scn-side narrow">
        <section class="scn-card"><h3>Approval alert</h3>
          <div class="scn-chips">
            <button type="button" id="scn-alert-heads" class="scn-chip sm" data-scn="alert:heads" aria-pressed="${String(scn.alert === "heads")}"><span class="scn-cl">Heads-up (no pill)</span></button>
            <button type="button" id="scn-alert-quiet" class="scn-chip sm" data-scn="alert:quiet" aria-pressed="${String(scn.alert === "quiet")}"><span class="scn-cl">Quiet (pill is showing)</span></button></div>
          <p class="scn-note"><code>approvals_v3</code> · HIGH · vibration <code>0,500,150,500</code>: heads-up and sound.</p>
          <p class="scn-note"><code>approvals_quiet</code> · LOW · no heads-up, no sound: the pill is the alert, the shade keeps the record.</p>
        </section>
        <section class="scn-card"><h3>Notification kinds</h3><div class="scn-chips">${kinds}</div>
          <p class="scn-note">${scn.nkind === "auto" ? "Following the live phone." : `Overridden: ${esc((SCN_NKINDS.find((k) => k[0] === scn.nkind) || [])[1] || "")}.`}</p>
          <p class="scn-note">Each kind has its own group (<code>kenai.approvals</code>, <code>kenai.link</code>, <code>kenai.status</code>) and no summary, so no «2» bundle.</p>
          <p class="scn-note">No Allow here: it always takes the app and the fingerprint. The link one is ongoing and not dismissible, and while a request waits it shows the link state only.</p>
          <p class="scn-note">Following the live phone nothing is invented: with no request pending there is no approval notification and no
            countdown, only the link and the states the phone has. The empty line in that slot is the page's, not the app's.</p>
        </section>
      </div>
    </div>`;
}

/* ---------- render ---------- */
function scnRender() {
  const root = $("#scenes");
  if (!root || root.hidden) { scnChronoStop(); scnFlashStop(); return; }
  const a = document.activeElement;
  const keep = a && a.id && root.contains(a) ? a.id : null;
  setHTML(root, scn.view === "screens" ? scnScreens() : scn.view === "island" ? scnIsland() : scn.view === "notif" ? scnNotif() : "");
  paintKoda(root);
  if (keep) { const el = document.getElementById(keep); if (el) el.focus(); }
  scnAfter();
}

function scnAfter() {
  if (scn.view === "island") {
    const el = $("#scn-isl");
    if (el && !el.classList.contains("in")) {
      requestAnimationFrame(() => { el.classList.add("in"); }); // slides down from the top edge
      clearTimeout(scn.guardTimer);
      scn.guardTimer = setTimeout(() => { scn.guardHit = false; changed(); }, SCN_ISL.tapGuardMs + 40);
    }
    scnFlashWatch(scn.retracted ? null : scnIslandSpec());
    scnChronoStop();
  } else if (scn.view === "notif") {
    clearTimeout(scn.guardTimer); scn.guardTimer = null;
    scnFlashStop();
    if (scn.notifAt && !scnReduce()) {
      if (!scn.chronoTimer) scn.chronoTimer = setInterval(scnChronoTick, 1000);
    } else scnChronoStop();
  } else { scnChronoStop(); scnFlashStop(); }
}

function scnChronoStop() {
  clearInterval(scn.chronoTimer); scn.chronoTimer = null;
}
function scnFlashStop() {
  clearTimeout(scn.flashTimer); scn.flashTimer = null;
  clearTimeout(scn.retractTimer); scn.retractTimer = null;
  scn.flashKey = "";
}
/** What the user changed can change what the pill shows: the flash's two timers and its retraction are dropped (R3). */
function scnFlashReset() {
  scnFlashStop();
  scn.retracted = false;
}
function scnChronoTick() {
  const t = scnChronoText();
  const a = $("#scn-chrono"), b = $("#scn-chrono-hu");
  if (!a && !b) { scnChronoStop(); return; }
  if (a) a.textContent = t;
  if (b) b.textContent = t;
}

/** IslandTimeline: a finished, an error and a rate limit are held 10 s, then the island curves back up in 340 ms.
 *  Anything else — a persistent kind, another key, nothing — cancels both timers, so a stale flash never hides it. */
function scnFlashWatch(spec) {
  const key = spec && SCN_FLASH.includes(spec.kind) ? spec.key : null;
  if (key && key === scn.flashKey) return; // the same flash, still held: its timer keeps running
  scnFlashStop();
  if (!key) return;
  scn.flashKey = key;
  scn.retracted = false;
  scn.flashTimer = setTimeout(() => {
    scn.flashTimer = null;
    const el = $("#scn-isl");
    if (el) { el.classList.remove("in"); el.classList.add("out"); }
    scn.retractTimer = setTimeout(() => { scn.retractTimer = null; scn.retracted = true; changed(); }, SCN_ISL.retractMs + 30);
  }, SCN_ISL.holdMs);
}

/* ---------- chips, switches and taps ---------- */
function scnChip(key, labelHtml, hint, act, arg) {
  return `<button type="button" id="scn-chip-${esc(key)}" class="scn-chip" data-scn="${esc(act)}"${arg === undefined || arg === null ? "" : ` data-arg="${esc(arg)}"`} data-chip="${esc(key)}" aria-pressed="${String(scn.chip === key)}">
    <span class="scn-cl">${labelHtml}</span>${hint ? `<span class="scn-h">${esc(hint)}</span>` : ""}</button>`;
}
/** A tap the guard lets through ("now" is what OverlayPolicy.tapAccepted would say). */
function scnTapOk() {
  if (performance.now() - scn.islShownAt >= SCN_ISL.tapGuardMs) return true;
  scn.guardHit = true;
  clearTimeout(scn.guardTimer);
  scn.guardTimer = setTimeout(() => { scn.guardHit = false; changed(); }, 700);
  changed();
  return false;
}
/** The demo's Deny/Action needs a live request: make the demo's own when the phone has none. */
function scnEnsureApproval() {
  if (approvals().length) return approvals()[0].fp;
  scnStep(2);
  return (approvals()[0] || {}).fp || null;
}

const SCN_ACTIONS = {
  "play:on": () => { if (st.mode === "none") setMode("paired"); else SC.play(true); },
  "play:off": () => { if (st.mode === "none") setMode("paired"); st.playing = false; schedule(); changed(); },

  "scene:none": () => setMode("none"),
  "scene:scan": () => go("SCAN"),
  "scene:step": (el) => scnStep(+el.dataset.arg),
  "scene:session": () => { scnStep(4); st.detailPill = "integration_claude"; go("SESSION"); },
  "scene:approval": () => { scnStep(2); SC.openApproval(); },
  "scene:question": () => { scnStep(3); SC.openQuestion("agent_codex"); },
  "scene:diff": () => { scnStep(4); ACT.openDiff("app/build.gradle.kts"); },
  "scene:chat": () => { scnStep(1); go("CHAT"); },
  "scene:go": (el) => go(el.dataset.arg),
  "scene:overlay": () => { go("SETTINGS"); st.sys = "overlay"; changed(); },
  "scene:lost": () => { scnReset(); setMode("paired"); st.link = "lost"; st.batterySnoozed = false; st.diag = { running: false, results: [] }; changed(); },
  "scene:notfound": () => { scnReset(); setMode("paired"); st.link = "notfound"; st.batterySnoozed = false; st.diag = { running: false, results: [] }; changed(); },

  "switch:follow": () => { scn.follow = !scn.follow; scn.islKey = ""; scnFlashReset(); changed(); },
  "switch:denyOnly": () => { scn.denyOnly = !scn.denyOnly; scn.islKey = ""; scnFlashReset(); changed(); },
  "switch:onScreen": () => { scn.onScreen = !scn.onScreen; scnFlashReset(); changed(); },
  "switch:switchOff": () => { scn.switchOff = !scn.switchOff; scnFlashReset(); changed(); },
  "switch:noPermit": () => { scn.noPermit = !scn.noPermit; scnFlashReset(); changed(); },
  "island:again": () => { scn.retracted = false; scn.flashKey = ""; scn.islKey = ""; changed(); },

  "alert:heads": () => { scn.alert = "heads"; changed(); },
  "alert:quiet": () => { scn.alert = "quiet"; changed(); },
  "notif:deny": () => { const fp = scnEnsureApproval(); if (fp) decide(fp, false); },
  "notif:review": () => { go("HOME"); SC.openApproval(); },
};

function scnBinder() {
  const root = $("#scenes");
  root.addEventListener("click", (e) => {
    const tap = e.target.closest("[data-isl]");
    if (tap && root.contains(tap)) {
      if (!scnTapOk()) return;
      const what = tap.dataset.isl;
      if (what === "deny") { const fp = scnEnsureApproval(); if (fp) decide(fp, false); }
      else if (what === "allow") { scnEnsureApproval(); SC.openApproval(); }
      else go("HOME");
      return;
    }
    const b = e.target.closest("[data-scn]");
    if (!b || b.disabled || !root.contains(b)) return;
    const key = b.dataset.scn;
    if (key.startsWith("kind:")) { scn.follow = false; scn.kind = key.slice(5); scn.islKey = ""; scnFlashReset(); changed(); return; }
    if (key.startsWith("nkind:")) { scn.nkind = key.slice(6); scn.notifAt = 0; changed(); return; }
    const fn = SCN_ACTIONS[key];
    if (!fn) return;
    if (b.dataset.chip) scn.chip = b.dataset.chip;
    fn(b);
  });
  root.addEventListener("keydown", (e) => {
    const tap = e.target.closest("[data-isl='open']");
    if (tap && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (scnTapOk()) go("HOME"); }
  });
}

/* ---------- init ---------- */
scnToolbar();
scnBinder();
scnView("widgets");
SC.subscribe(() => scnRender());

</script>
</body></html>
